name: Verify published ecological values
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tests/verify-values.cjs'
      - 'tests/verify-scenarios.cjs'
      - 'tests/verify-assessment.cjs'
      - 'site-assessments/**'
      - 'assessment.html'
      - 'EVIDENCE_REGISTER.md'
      - 'index.html'
      - '.github/workflows/verify-evidence.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'tests/verify-values.cjs'
      - '.github/workflows/verify-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact published source figures
        run: node tests/verify-values.cjs
      - name: Validate live numerical scenarios
        run: node tests/verify-scenarios.cjs
      - name: Validate Hays County site assessment integrity
        run: node tests/verify-assessment.cjs
